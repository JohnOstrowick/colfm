<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Folderize Icon</title>
    <style>
        body {
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .stack {
            position: relative;
            width: 100px;
            height: 100px;
        }
        .stack i {
            position: absolute;
            color: white;
            font-size: 72pt;
            top: 0;
            left: 0;
        }
        .stack .arrow {
            font-size: 48pt;
            top: 20px;
            left: 30px;
        }
    </style>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="stack">
        <i class="fas fa-folder"></i>
        <i class="fas fa-arrow-right arrow"></i>
    </div>
</body>
</html>
