<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FA Tag Sampler</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    html, body { height: 100%; }
    body{
      background: #000;
      color: #fff;
      margin: 0;
      padding: 40px;
      display: flex;
      gap: 40px;            /* spacing so they aren't jammed together */
      align-items: flex-start;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Arial, sans-serif;
    }
    .tile{
      text-align: center;
      width: 170px;
    }
    .tile i{
      font-size: 72pt;      /* requested size */
      line-height: 1;
      color: #fff;          /* white icons */
      display: block;
    }
    .label{
      margin-top: 12px;
      font-size: 12pt;
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="tile">
    <i class="fa-solid fa-tag" aria-hidden="true" title="fa-tag"></i>
    <div class="label">fa-tag</div>
  </div>

  <div class="tile">
    <i class="fa-solid fa-tags" aria-hidden="true" title="fa-tags"></i>
    <div class="label">fa-tags</div>
  </div>

</body>
</html>
