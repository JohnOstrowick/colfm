<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Zip and Unzip Icon Variants</title>
    <style>
        body {
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 50px;
            padding: 40px;
            margin: 0;
            flex-wrap: wrap;
        }
        .icon {
            position: relative;
            width: 100px;
            height: 120px;
            text-align: center;
        }
        .icon i {
            color: white;
            font-size: 64pt;
        }
        .icon .stack {
            position: relative;
            width: 100px;
            height: 100px;
        }
        .stack i {
            position: absolute;
            top: 0;
            left: 0;
        }
        .stack .arrow {
            font-size: 48pt;
            top: 20px;
            left: 120px;
            color: white;
        }
        .label {
            color: white;
            font-size: 12pt;
            margin-top: 105px;
            font-family: sans-serif;
        }
    </style>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body>
<div class="icon">
    <div class="stack">
        <i class="fas fa-box"></i>
        <i class="fas fa-arrow-down arrow"></i>
    </div>
    <div class="label">zip (box + ↓)</div>
</div>

<div class="icon">
    <div class="stack">
        <i class="fas fa-box-open"></i>
        <i class="fas fa-arrow-up arrow"></i>
    </div>
    <div class="label">unzip (box-open + ↑)</div>
</div>
</body>
</html>
