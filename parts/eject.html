<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Eject Icon (white on black)</title>
<style>
  :root { --size: 32px; } /* change to 16/24/48/etc for export */
  html, body {
    margin: 0;
    background: #000;          /* black background */
  }
  .wrap {
    width: var(--size);
    height: var(--size);
    display: grid;
    place-items: center;
  }
  /* Optional padding ring—delete if you want the SVG to fill the PNG edge-to-edge */
  .pad {
    width: calc(var(--size) - 2px);
    height: calc(var(--size) - 2px);
  }
  svg {
    width: 100%;
    height: 100%;
    display: block;
    fill: #fff;                /* white icon */
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="pad">
      <!-- Inline SVG: eject (triangle above a line) -->
      <!-- viewBox 0 0 24 24 scales cleanly; exported PNG will be var(--size) square -->
      <svg viewBox="0 0 24 24" aria-label="eject">
        <!-- triangle -->
        <path d="M12 4 L3 16 H21 Z"/>
        <!-- base line -->
        <rect x="3" y="18" width="18" height="2" rx="1" ry="1"/>
      </svg>
    </div>
  </div>
</body>
</html>
