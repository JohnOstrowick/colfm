<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Desktop & Downloads Icons (FA)</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    body{
      background:#000;
      margin:0;
      padding:40px;
      display:flex;
      justify-content:center;
      align-items:flex-start;
      gap:50px;              /* ~50px gap between icons */
      flex-wrap:wrap;
      font-family: Arial, sans-serif;
    }
    .icon{
      text-align:center;
      width: 160px;
    }
    .icon i{
      color:#fff;            /* white icons */
      font-size:72pt;        /* 72pt size */
      line-height:1;
      display:block;
    }
    .label{
      color:#fff;
      font-size:12pt;
      margin-top:12px;
      letter-spacing:0.3px;
    }
  </style>
</head>
<body>
  <!-- Desktop (modern) -->
  <div class="icon">
    <i class="fa-solid fa-computer"></i>
    <div class="label">fa-computer</div>
  </div>

  <!-- Desktop (legacy/fallback) -->
  <div class="icon">
    <i class="fa-solid fa-desktop"></i>
    <div class="label">fa-desktop</div>
  </div>

  <!-- Downloads (classic) -->
  <div class="icon">
    <i class="fa-solid fa-download"></i>
    <div class="label">fa-download</div>
  </div>

  <!-- Downloads (modern alternative) -->
  <div class="icon">
    <i class="fa-solid fa-arrow-down-to-line"></i>
    <div class="label">fa-arrow-down-to-line</div>
  </div>
</body>
</html>
