<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8" />
<title>Empty Trash Icon</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  html,body{background:#fff;margin:0;height:100%}
  .wrap{display:flex;align-items:center;justify-content:center;height:100vh}
  .icon{position:relative;width:200px;height:200px;color:#000}
  .bin{position:absolute;font-size:144px;left:28px;top:28px}
  .broom{position:absolute;font-size:96px;left:-50px;top:50px;transform:rotate(-30deg)}
</style>
</head><body>
<div class="wrap">
  <div class="icon" aria-label="Empty trash">
    <i class="fa-solid fa-trash-can bin"></i>
    <i class="fa-solid fa-broom broom"></i>
  </div>
</div>
</body></html>
