<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Move to Trash (Horizontal Arrow)</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    html, body { background:#fff; margin:0; height:100%; }
    .wrap { display:flex; align-items:center; justify-content:center; height:100vh; }
    .stage { position:relative; width:360px; height:200px; }
    .icon { position:absolute; color:#000; }
    .arrow { font-size:144px; left:80px; top:28px; }      /* → */
    .bin   { font-size:144px; left:198px; top:28px; }     /* 🗑 */
  </style>
</head>
<body>
  <div class="wrap">
    <div class="stage" aria-label="Move to trash">
      <i class="fa-solid fa-trash-can icon bin"></i>
    </div>
  </div>
</body>
</html>
