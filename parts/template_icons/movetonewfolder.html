<html>
<head>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
<style type="text/css">
/* Composite icon: two diagonal arrows pointing into a folder */
.icon-place-into-folder{
  position: relative;
  display: inline-block;
  width: 1.7em;   /* tweak to match your toolbar scale */
  height: 1.4em;
}
.icon-place-into-folder .base{
  font-size: 1.7em; /* folder size */
  line-height: 1;
}
.icon-place-into-folder .arrow{
  position: absolute;
  font-size: 0.7em; /* arrow size */
  line-height: 1;
  opacity: 0.95;
}

/* Top-left arrow: diagonal towards folder */
.icon-place-into-folder .arrow-tl{
  top: 10px;
  left: -10px;
  transform: rotate(45deg);        /* ↘ */
}

/* Bottom-right arrow: diagonal towards folder */
.icon-place-into-folder .arrow-br{
  right: -10px;
  bottom: 0px;
  transform: rotate(-135deg);      /* ↖ */
}
</style>
<!-- Requires Font Awesome (v5 or v6). Using 'fas' classes for compatibility. -->
  <span class="icon-place-into-folder" style="left:100px !important">
    <i class="fas fa-folder base"></i>
    <i class="fas fa-arrow-right arrow arrow-tl"></i>
    <i class="fas fa-arrow-right arrow arrow-br"></i>
  </span>
