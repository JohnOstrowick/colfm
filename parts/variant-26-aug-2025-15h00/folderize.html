<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Folderize Icon</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .icon-container {
      width: 200px;
      height: 200px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .icon-container i {
      font-size: 72pt;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="icon-container">
    <i class="fas fa-folder-arrow-down"></i>
  </div>
</body>
</html>
